<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0d1209">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MiND — канвас мислення</title>
<style>
:root{
  --bg:#0d1209;--panel:#131a0e;--panel2:#1a2314;--panel3:#232e1b;--line:#2f3d25;--line2:#435434;
  --fg:#dfeed4;--mute:#7b9169;--acc:#64fe13;--acc-ink:#0f2b00;--warn:#d99a9a;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;transform:scaleX(-1);filter:brightness(.32) saturate(.6);opacity:0;transition:opacity .4s}
video.on{opacity:1}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{pointer-events:none}
#fx{touch-action:none;cursor:default}
#fx.grab{cursor:grab}#fx.grabbing{cursor:grabbing}#fx.cross{cursor:crosshair}#fx.pan{cursor:move}

/* ── chrome ── */
.bar{position:absolute;left:0;right:0;display:flex;align-items:center;gap:8px;padding:8px 10px;pointer-events:none;z-index:5}
.bar>*{pointer-events:auto}
#top{top:0;padding-top:calc(8px + var(--sat))}
#top .lvl{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
#top .name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .sub{font-family:var(--mono);font-size:10px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs{display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none;max-width:60vw}
.crumbs::-webkit-scrollbar{display:none}
.crumb{flex:0 0 auto;font-family:var(--mono);font-size:10px;color:var(--mute);background:transparent;border:1px solid transparent;border-radius:999px;padding:4px 8px;cursor:pointer;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;min-height:28px}
.crumb.cur{color:var(--acc-ink);background:var(--acc);border-color:var(--acc)}
.crumb .sep{opacity:.5;margin-right:4px}

.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:600 12px var(--sans);border-radius:999px;height:40px;min-width:40px;padding:0 14px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .12s,border-color .12s,transform .08s}
.btn:active{transform:scale(.96)}
.btn:hover{background:var(--panel3);border-color:var(--line2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.on:hover{background:#7dff3a}
.btn.sm{height:30px;font-size:11px;padding:0 11px;min-width:30px}
.btn.icon{padding:0;width:40px}
.btn.sm.icon{width:30px}
.btn{flex:0 0 auto}
.btn svg{flex:0 0 auto;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.icon svg{width:18px;height:18px}
.btn.icon.sm svg{width:15px;height:15px}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.4;pointer-events:none}

#bottom{bottom:0;flex-direction:column;align-items:stretch;gap:8px;padding:8px 10px calc(10px + var(--sab));background:linear-gradient(180deg,rgba(13,18,9,0) 0%,rgba(13,18,9,.92) 30%)}
#bottom .row{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none}
#bottom .row::-webkit-scrollbar{display:none}
@media (max-width:400px){#bThread span,#bSelect span{display:none}#bThread,#bSelect{width:40px;padding:0}}
#bottom .row .sp{flex:1 1 auto}
#hint{font-family:var(--mono);font-size:10px;color:var(--mute);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;min-height:12px}
#hint b{color:var(--fg);font-weight:500}

body.desk #top{padding:12px 12px 0}
body.desk .btn{height:30px;font-size:11px;padding:0 11px;min-width:30px}
body.desk .btn.icon{width:30px}
body.desk .crumb{min-height:24px;padding:2px 8px}
body.desk #bottom{align-items:center;padding:8px 12px 12px;background:none}
body.desk #bottom .row{justify-content:center}
body.desk #sheet{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);width:auto;max-width:min(92vw,720px)}

#ruler{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:none;flex-direction:column;align-items:flex-end;z-index:4}
body.desk #ruler{display:flex}
#ruler .cap{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--mute);margin-bottom:4px}
#ruler button{display:flex;align-items:center;justify-content:flex-end;gap:8px;background:none;border:0;padding:0 0 0 14px;cursor:pointer;height:34px;color:var(--mute);font-family:var(--mono);font-size:10px}
#ruler button i{display:block;height:1px;width:9px;background:currentColor}
#ruler button.cur{color:var(--acc)}#ruler button.cur i{width:22px}#ruler button.near i{width:14px}

#sheet{display:none;grid-template-columns:repeat(2,1fr);gap:6px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:4px}
#sheet.open{display:grid}
body.desk #sheet.open{display:flex;flex-wrap:wrap;justify-content:center}
#sheet .btn{height:40px;justify-content:flex-start}
body.desk #sheet .btn{height:30px}
#sheet .wide{grid-column:1/-1}

#search{display:none;align-items:center;gap:6px}
#search.open{display:flex}
#search input{width:150px;height:36px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 12px;color:var(--fg);font:400 13px var(--sans);outline:none}
#search input:focus{border-color:var(--acc)}
body.desk #search input{height:30px;width:180px}

/* ── overlays ── */
.ov{position:absolute;left:0;top:0;z-index:6;will-change:transform;pointer-events:none}
#tip{animation:fade .12s linear}
#tip .box{transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;max-width:260px}
#tip .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
#tip .m{font-family:var(--mono);font-size:10px;color:var(--mute)}

#menu{pointer-events:auto}
#menu .ring{position:relative;width:0;height:0;animation:pop .14s cubic-bezier(.33,1,.68,1)}
#menu .pill{position:absolute;transform:translate(-50%,-50%);min-width:44px;height:44px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:600 12px var(--sans);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:background .1s,border-color .1s,transform .1s}
#menu .pill svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#menu .pill.hot,#menu .pill:hover{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);transform:translate(-50%,-50%) scale(1.08)}
#menu .pill.danger{color:var(--warn)}
#menu .pill.danger.hot{background:#5a2a2a;color:#ffd4d4;border-color:#7a3a3a}
#menu .core{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px rgba(100,254,19,.18)}

#editor{pointer-events:auto;z-index:8}
#editor .box{transform:translateX(-50%);width:min(300px,86vw);background:var(--bg);border:1px solid var(--acc);border-radius:10px;padding:6px 6px 6px 10px;box-shadow:0 0 0 1px rgba(100,254,19,.35),0 0 22px rgba(100,254,19,.22);display:flex;align-items:flex-end;gap:6px}
#editor textarea{flex:1 1 auto;background:transparent;border:0;outline:none;color:var(--fg);font:400 14px/1.3 var(--sans);resize:none;min-height:22px;max-height:96px;padding:4px 0;-webkit-user-select:text;user-select:text}
#editor .btn{height:30px;min-width:30px;padding:0 10px;flex:0 0 auto}
#editor .btn.icon{width:30px}
#editor .mic.live{color:var(--acc);border-color:var(--acc);animation:pulse 1.2s infinite}
#editor.dock{left:0!important;right:0;transform:none!important;top:auto!important}
#editor.dock .box{transform:none;width:auto;margin:0 10px;border-radius:12px 12px 0 0;border-bottom:0}

#toast{position:absolute;left:12px;bottom:calc(118px + var(--sab));z-index:9;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
body.desk #toast{bottom:62px}
#toast .t{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-family:var(--mono);font-size:11px;color:var(--fg);animation:toast .16s cubic-bezier(.33,1,.68,1);display:flex;align-items:center;gap:10px;pointer-events:auto}
#toast .t button{background:none;border:0;color:var(--acc);font:600 11px var(--mono);cursor:pointer;padding:0}

#airstrip{position:absolute;left:50%;top:calc(66px + var(--sat));transform:translateX(-50%);max-width:min(92vw,620px);z-index:6;pointer-events:none;display:none;animation:fade .16s}
#airstrip.on{display:block}
#airstrip .box{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
#airstrip .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px rgba(100,254,19,.18);flex:0 0 auto}
#airstrip .dot.wait{background:var(--mute);animation:pulse 1s infinite}
#airstrip span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#airchips{position:absolute;left:50%;top:calc(108px + var(--sat));transform:translateX(-50%);display:none;gap:6px;z-index:6}
#airchips.on{display:flex}

#empty{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;pointer-events:none;text-align:center;padding:0 24px;z-index:3}
#empty.on{display:flex}
#empty .t{font-size:16px;font-weight:600}
#empty .b{font-size:13px;color:var(--mute);max-width:320px;text-wrap:pretty}

#onb{position:absolute;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(13,18,9,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#onb.on{display:flex}
#onb .card{width:min(440px,100%);margin:0 10px calc(12px + var(--sab));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;animation:toast .2s cubic-bezier(.33,1,.68,1)}
#onb h2{font-size:16px}
#onb p{font-size:13px;color:var(--mute);line-height:1.45}
#onb .g{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;align-items:center}
#onb .g b{font-family:var(--mono);font-size:11px;color:var(--acc);font-weight:500;white-space:nowrap}
#onb .acts{display:flex;gap:8px;justify-content:flex-end}

.label{position:absolute;left:0;top:0;pointer-events:none;z-index:3}
.label span{display:block;transform:translate(-50%,-50%);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--fg);white-space:nowrap}

/* haptic trick for iOS: a switch that we toggle programmatically */
#hap{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes toast{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>

  <div id="empty"><span class="t"></span><span class="b"></span></div>
  <div id="labels"></div>

  <div id="top" class="bar">
    <div class="lvl"><span class="name"></span><span class="sub"></span></div>
    <div class="crumbs" id="crumbs"></div>
    <div id="search"><input placeholder="Пошук думки" spellcheck="false" autocomplete="off"></div>
    <button class="btn ghost icon" id="bSearch" title="Пошук"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <button class="btn ghost icon" id="bHelp" title="Жести"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.7M12 17h.01"/></svg></button>
  </div>

  <div id="ruler"><span class="cap">МАСШТАБ</span><div id="rulerItems"></div></div>

  <div id="bottom" class="bar">
    <div id="sheet">
      <button class="btn" id="bTidy"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/></svg>Впорядкувати</button>
      <button class="btn" id="bMagnet" title="Магніт: думки тягнуться до курсора"><svg viewBox="0 0 24 24"><path d="M6 4v8a6 6 0 0 0 12 0V4"/><path d="M6 4h4v8a2 2 0 0 0 4 0V4h4"/></svg>Магніт</button>
      <button class="btn" id="bFocus"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>Фокус</button>
      <button class="btn" id="bUndo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-4"/></svg>Назад</button>
      <button class="btn" id="bRedo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h4"/></svg>Вперед</button>
      <button class="btn" id="bSound"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10H4z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg><span>Звук</span></button>
      <button class="btn" id="bAir"><svg viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11M11 10V4.5a1.5 1.5 0 0 1 3 0V11M14 10.5V6.5a1.5 1.5 0 0 1 3 0V13"/><path d="M17 13a1.5 1.5 0 0 1 3 0v2a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.6-2.8L4 14.5a1.5 1.5 0 0 1 2.4-1.8L8 14"/></svg><span>Air</span></button>
      <button class="btn" id="bPng"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></svg>PNG</button>
      <button class="btn" id="bMd"><svg viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>Текст</button>
      <button class="btn" id="bJsonOut"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>Експорт JSON</button>
      <button class="btn" id="bJsonIn"><svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 19h16"/></svg>Імпорт JSON</button>
      <button class="btn" id="bExpand" style="display:none"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Розгорнути</span></button>
      <button class="btn" id="bShake" style="display:none"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M3 8v8M21 8v8"/></svg>Струс = впорядкувати</button>
      <button class="btn danger wide" id="bClear"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Очистити полотно</button>
    </div>
    <div class="row">
      <button class="btn icon" id="bUp" title="На рівень вище"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      <button class="btn on" id="bNew"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Нова думка</span></button>
      <button class="btn" id="bThread" title="Режим нитки: тап по двох думках"><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8 16c3-1 5-3 8-8"/></svg><span>Нитка</span></button>
      <button class="btn" id="bSelect" title="Вибір кількох думок"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 3 3 5-6"/></svg><span>Вибір</span></button>
      <span class="sp"></span>
      <button class="btn icon" id="bMore" title="Меню"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
    </div>
    <div class="row" id="selbar" style="display:none">
      <span id="selCount" style="font:600 12px var(--sans);color:var(--acc);padding:0 6px;white-space:nowrap">0</span>
      <button class="btn on" id="bGroup"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="11" r="2"/><circle cx="15" cy="13" r="2"/></svg><span>Згрупувати</span></button>
      <button class="btn" id="bMerge"><svg viewBox="0 0 24 24"><circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/></svg><span>Злити</span></button>
      <button class="btn" id="bLinkAll" title="Зв'язати всі вибрані між собою"><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8 16c3-1 5-3 8-8"/></svg></button>
      <span class="sp"></span>
      <button class="btn ghost" id="bSelCancel">Скасувати</button>
    </div>
    <div id="hint"></div>
  </div>

  <div id="tip" class="ov" style="display:none"><div class="box"><span class="t"></span><span class="m"></span></div></div>
  <div id="menu" class="ov" style="display:none"><div class="ring"><i class="core"></i></div></div>
  <div id="editor" class="ov" style="display:none"><div class="box"><textarea rows="1" placeholder="Сформулюй думку…" spellcheck="false"></textarea><button class="btn icon mic" id="bMic" title="Диктувати"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><button class="btn icon on" id="bOk" title="Зберегти"><svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg></button></div></div>
  <div id="airstrip"><div class="box"><i class="dot"></i><span></span></div></div>
  <div id="airchips"><button class="btn sm" id="bFlip">Фліп камери</button><button class="btn sm" id="bAirOff">Вимкнути Air</button></div>
  <div id="toast"></div>

  <div id="onb"><div class="card">
    <h2>MiND — канвас мислення</h2>
    <p>Думки — краплі. Близькі зливаються, зв'язані тримаються разом, старі тьмяніють. Кожну думку можна відкрити як окремий рівень.</p>
    <div class="g" id="onbG"></div>
    <div class="acts"><button class="btn" id="onbSkip">Зрозуміло</button><button class="btn on" id="onbGo">Почати</button></div>
  </div></div>

  <label id="hap"><input type="checkbox" switch></label>
</div>
<script>
(() => {
'use strict';
// ═══════════════════════════════════════════════════════════════════
//  MiND — канвас мислення. Один файл, без збірки.
//  Шари: video → WebGL2 (метаболи) → Canvas2D (нитки, підписи, Air) → DOM UI
// ═══════════════════════════════════════════════════════════════════
const KEY = 'mind-canvas-v2';           // той самий ключ, що й у попередній версії
const PREF = 'mind-prefs-v3';
const CATS = ['#a8bd97', '#d3c48c', '#b2a6c8', '#a6b0c8', '#d3ab8c', '#5a4646'];
const CAT_NAMES = ['нейтральна', 'увага', 'ідея', 'питання', 'ризик', 'у горизонт'];
